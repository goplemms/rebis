<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebis — Athanor prototype</title>
<style>
  :root {
    --bg: #14100e;
    --line: #3a2e26;
    --ember: #e0703a;
    --gold: #d4a95a;
    --parchment: #e8dcc4;
    --dim: #7a6a5c;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px;
    background: var(--bg);
    color: var(--parchment);
    font: 15px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex; justify-content: center;
    user-select: none;
  }
  .wrap { width: 100%; max-width: 360px; }
  h1 { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; font-weight: 400;
       color: var(--gold); margin: 0 0 18px; }

  /* ---- placement ---- */
  .tools { display: flex; gap: 6px; margin-bottom: 10px; }
  button {
    font: inherit; font-size: 13px; color: var(--parchment); background: #241c18;
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; cursor: pointer;
    letter-spacing: .04em;
  }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button.sel { border-color: var(--gold); color: var(--gold); background: #2c221b; }

  .grid { display: grid; gap: 4px; }
  .cell {
    width: 62px; height: 62px; border: 1px solid var(--line); background: #191412;
    border-radius: 3px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .cell:hover { border-color: var(--gold); }
  .cell .heat { position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
                background: radial-gradient(circle, var(--ember), transparent 72%); opacity: 0; }
  .cell .glyph { position: relative; }
  .cell .stack { display: block; font-size: 17px; line-height: 1.05; }
  .cell .num { position: absolute; bottom: 1px; left: 0; right: 0; font-size: 10px;
               color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ---- the one bar ---- */
  .bar {
    position: relative; height: 46px; margin-top: 18px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; background: #100c0a; overflow: hidden;
  }
  .bar:hover { border-color: var(--gold); }
  .bar .flame { position: absolute; inset: 0 auto 0 0; width: 0;
                background: linear-gradient(90deg, #6b3a1f, var(--ember)); }
  .bar .vessel { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--parchment);
                 box-shadow: 0 0 6px rgba(232,220,196,.8); }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; }
  .bar .tick.pure { background: var(--gold); }
  .bar .tick.strain { background: var(--danger); }
  .bar .cap { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; letter-spacing: .18em; text-transform: uppercase;
              font-size: 11px; text-shadow: 0 0 6px #000, 0 0 3px #000; }

  .foot { display: flex; justify-content: space-between; align-items: baseline;
          margin-top: 10px; font-size: 12px; color: var(--dim); min-height: 40px; }
  .foot em { font-style: italic; }
  .foot .over { color: var(--gold); font-style: normal; }
  .reset { background: none; border: none; color: var(--dim); text-decoration: underline;
           padding: 0; font-size: 12px; cursor: pointer; flex: none; }
  .reset:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Athanor</h1>

  <div class="tools">
    <button id="t-pit">Fire pit</button>
    <button id="t-cuc">Cucurbit</button>
    <button id="t-clr">Clear</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="bar" id="bar">
    <div class="flame" id="flame"></div>
    <div class="tick pure" id="tick-pure"></div>
    <div class="tick strain" id="tick-strain"></div>
    <div class="vessel" id="vessel"></div>
    <div class="cap" id="cap">Stoke the flame</div>
  </div>

  <div class="foot">
    <span id="hint"></span>
    <button class="reset" id="reset">new work</button>
  </div>
</div>

<script src="tuning.js"></script>
<script src="sim.js"></script>
<script>
'use strict';
const C = TUNING;
const $ = id => document.getElementById(id);
let S, tool = 'pit';

const gridEl = $('grid');
gridEl.style.gridTemplateColumns = `repeat(${C.grid.size}, 62px)`;
const cells = [];
for (let i = 0; i < C.grid.size * C.grid.size; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = '<div class="heat"></div><div class="glyph"></div><div class="num"></div>';
  c.addEventListener('click', () => onCell(i));
  gridEl.appendChild(c);
  cells.push({ el: c, heat: c.children[0], glyph: c.children[1], num: c.children[2] });
}

function reset() { S = Sim.createWork(C); paint(); }

function onCell(i) {
  if (S.over || S.lit) return;          // nothing may be rearranged once it's burning
  const b = S.board;
  if (tool === 'clr') {
    if (i === b.pit) b.pit = -1;
    if (i === b.cucurbit) b.cucurbit = -1;
  } else if (tool === 'pit') {
    b.pit = i;                          // each piece has its own slot, so the
  } else {                              // vessel may sit ON the fire (distance 0)
    b.cucurbit = i;
  }
  paint();
}

// The bar is the whole control: it lights the fire on the first press, then stokes.
function poke() {
  if (S.over) return;
  if (!S.lit) Sim.light(S, C);
  else Sim.stoke(S, C);
}
$('bar').addEventListener('mousedown', poke);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); poke(); }
});

$('t-pit').onclick = () => { tool = 'pit'; paint(); };
$('t-cuc').onclick = () => { tool = 'cuc'; paint(); };
$('t-clr').onclick = () => { tool = 'clr'; paint(); };
$('reset').onclick = reset;

function paint() {
  const b = S.board, max = C.fire.maxHeat;
  const placed = b.pit >= 0 && b.cucurbit >= 0;
  const d = placed ? Sim.distance(b.cucurbit, b.pit, C) : 0;
  const falloff = C.transfer.falloff[d];

  // ── board ──
  cells.forEach((c, i) => {
    const isPit = i === b.pit, isCuc = i === b.cucurbit;
    c.glyph.innerHTML = isPit && isCuc ? '<span class="stack">⚗️<br>🔥</span>'
                      : isPit ? '🔥' : isCuc ? '⚗️' : '';
    c.el.style.borderColor = '';
    const heat = isPit ? S.heat : isCuc ? S.local : 0;
    c.heat.style.opacity = (heat / max * 0.85).toFixed(2);
    c.num.textContent = heat > 0.5 ? heat.toFixed(0) : '';
    if (isCuc) {
      // strain shows as the glass reddening, rather than as another gauge
      const strain = S.strain / C.vessel.crackAt;
      if (strain > 0.02) c.el.style.borderColor =
        `rgba(192,57,43,${(0.3 + strain * 0.7).toFixed(2)})`;
    }
  });

  $('t-pit').className = tool === 'pit' ? 'sel' : '';
  $('t-cuc').className = tool === 'cuc' ? 'sel' : '';
  $('t-clr').className = tool === 'clr' ? 'sel' : '';

  // ── the bar ──
  // Ticks live in vessel-heat units, so they get divided back through the
  // falloff to land where the FLAME has to be. Move the vessel, ticks slide.
  $('flame').style.width = (S.heat / max * 100) + '%';
  $('vessel').style.left = (S.local / max * 100) + '%';
  $('vessel').style.opacity = placed ? 1 : 0;
  for (const [id, level] of [['tick-pure', C.refining.pureLimit],
                             ['tick-strain', C.vessel.strainAbove]]) {
    const flameNeeded = level / falloff;
    const el = $(id);
    el.style.opacity = placed && flameNeeded <= max ? 1 : 0;
    el.style.left = (flameNeeded / max * 100) + '%';
  }

  $('cap').textContent = !placed ? '' : S.over ? '' : S.lit ? 'Stoke' : 'Light the fire';
  $('cap').style.color = S.lit ? 'var(--parchment)' : 'var(--gold)';

  // ── one line of text ──
  let h;
  if (S.over) h = `<span class="over">${S.over}</span>`;
  else if (!placed) h = '<em>Place a fire pit and a cucurbit.</em>';
  else if (!S.lit) h = `<em>Distance ${d} — the vessel sees ${(falloff * 100) | 0}% of the flame, ` +
                       `smoothed over ${C.transfer.lagSeconds[d]}s.</em>`;
  else h = '<em>Click the bar or press space.</em>';
  $('hint').innerHTML = h;
}

reset();
let last = performance.now();
requestAnimationFrame(function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  Sim.tick(S, C, dt);
  paint();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
