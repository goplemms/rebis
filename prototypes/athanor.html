<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebis — Athanor prototype</title>
<style>
  :root {
    --bg: #14100e;
    --panel: #1e1815;
    --line: #3a2e26;
    --ember: #e0703a;
    --gold: #d4a95a;
    --parchment: #e8dcc4;
    --vapor: #8fa3b0;
    --dim: #7a6a5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg);
    color: var(--parchment);
    font: 15px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { font-size: 20px; letter-spacing: .14em; text-transform: uppercase; font-weight: 400;
       color: var(--gold); margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; font-style: italic; margin-bottom: 20px; }

  .cols { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .left { flex: 0 0 auto; }
  .right { flex: 1 1 260px; min-width: 240px; }

  /* ---- grid ---- */
  .grid { display: grid; grid-template-columns: repeat(5, 62px); gap: 4px; }
  .cell {
    width: 62px; height: 62px; border: 1px solid var(--line); background: #191412;
    border-radius: 3px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; transition: background .15s, border-color .15s;
  }
  .cell:hover { border-color: var(--gold); }
  .cell.glow { background: radial-gradient(circle, rgba(224,112,58,.30), transparent 70%); }
  .cell .tag { position: absolute; bottom: 2px; left: 0; right: 0;
               font-size: 9px; color: var(--dim); letter-spacing: .06em; }
  .cell.pit.lit { animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { filter: brightness(1) } 50% { filter: brightness(1.35) } }

  /* ---- panels ---- */
  .box { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; margin-bottom: 12px;
         background: var(--panel); }
  .box h2 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
            color: var(--dim); margin: 0 0 9px; font-weight: 400; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; }
  .row .k { color: var(--dim); font-size: 13px; }
  .row .v { font-variant-numeric: tabular-nums; font-size: 16px; }
  .v.gold { color: var(--gold); } .v.vapor { color: var(--vapor); } .v.ember { color: var(--ember); }

  /* ---- gauge ---- */
  .gauge { position: relative; height: 22px; border: 1px solid var(--line);
           border-radius: 3px; background: #100c0a; overflow: hidden; margin: 6px 0 4px; }
  .gauge .fill { position: absolute; inset: 0 auto 0 0; width: 0;
                 background: linear-gradient(90deg, #6b3a1f, var(--ember)); transition: width .1s linear; }
  .gauge .mark { position: absolute; top: 0; bottom: 0; width: 1px; }
  .mark.safe { background: var(--gold); }
  .mark.danger { background: #c0392b; }
  .gauge .lbl { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; font-size: 11px; letter-spacing: .1em;
                text-shadow: 0 0 4px #000; font-variant-numeric: tabular-nums; }
  .strain .fill { background: linear-gradient(90deg, #5c2a24, #c0392b); }
  .legend { font-size: 11px; color: var(--dim); display: flex; gap: 12px; }
  .legend i { font-style: normal; }
  .legend .s { color: var(--gold); } .legend .d { color: #c0392b; }

  /* ---- controls ---- */
  button {
    font: inherit; font-size: 13px; color: var(--parchment); background: #241c18;
    border: 1px solid var(--line); border-radius: 3px; padding: 7px 13px; cursor: pointer;
    letter-spacing: .04em;
  }
  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: .35; cursor: default; }
  button.sel { border-color: var(--gold); color: var(--gold); background: #2c221b; }
  .tools { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--dim); font-style: italic; min-height: 34px; margin-top: 8px; }
  .over { color: var(--gold); font-style: normal; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Athanor</h1>
  <div class="sub">Rebis — step one. Turn a finite pile of wood into as much distillate as you can.</div>

  <div class="cols">
    <div class="left">
      <div class="tools">
        <button id="t-pit">Fire pit</button>
        <button id="t-cuc">Cucurbit</button>
        <button id="t-clr">Clear</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="right">
      <div class="box">
        <h2>Flame</h2>
        <div class="gauge"><div class="fill" id="g-heat"></div><div class="lbl" id="l-heat"></div></div>
        <div class="row"><span class="k">Local heat at cucurbit</span></div>
        <div class="gauge">
          <div class="fill" id="g-local"></div>
          <div class="mark safe" id="m-safe"></div>
          <div class="mark danger" id="m-danger"></div>
          <div class="lbl" id="l-local"></div>
        </div>
        <div class="legend"><i class="s">│ pure limit</i><i class="d">│ strain</i></div>
        <div style="margin-top:10px" class="row"><span class="k">Vessel strain</span></div>
        <div class="gauge strain"><div class="fill" id="g-strain"></div></div>
      </div>

      <div class="box">
        <h2>Stores</h2>
        <div class="row"><span class="k">Wood</span><span class="v ember" id="v-wood">—</span></div>
        <div class="row"><span class="k">Prima materia</span><span class="v" id="v-mat">—</span></div>
        <div class="row"><span class="k">Distillate</span><span class="v gold" id="v-dist">—</span></div>
        <div class="row"><span class="k">Vapour lost</span><span class="v vapor" id="v-vap">—</span></div>
      </div>

      <div class="box">
        <h2>Tending</h2>
        <div class="tools" style="margin:0">
          <button id="b-light">Light the fire</button>
          <button id="b-stoke">Stoke &nbsp;(space)</button>
          <button id="b-reset">New work</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// Every number here is a first guess. Tuning these is the point.
// ─────────────────────────────────────────────────────────────
const C = {
  grid: 5,
  wood: 50,
  materia: 100,

  stokeHeat: 8,        // heat gained per stoke
  stokeWood: 1,        // wood spent per stoke
  upkeepWood: 0.30,    // wood/sec just to stay lit
  decay: 0.06,         // heat lost per sec, as a fraction of current heat
  maxHeat: 100,

  // how heat reaches the cucurbit, by Chebyshev distance from the pit
  falloff: [1.00, 0.85, 0.60, 0.30, 0.10],
  lag:     [0.00, 3.00, 8.00, 14.0, 20.0],   // seconds of thermal smoothing

  refine: 0.02,        // materia consumed per sec, per point of local heat
  pureLimit: 50,       // below this, everything condenses
  vaporWidth: 40,      // how fast vapour takes over past the limit (squared falloff)
  strainAt: 85,        // local heat above which the vessel strains
  strainRate: 0.02,
  strainRelief: 0.06,
};

const S = {};
function reset() {
  S.board = Array.from({length: C.grid * C.grid}, () => null);
  S.pit = -1; S.cuc = -1;
  S.lit = false;
  S.heat = 0; S.local = 0; S.strain = 0;
  S.wood = C.wood; S.materia = C.materia;
  S.distillate = 0; S.vapor = 0;
  S.over = null;
  S.tool = 'pit';
  render();
}

const dist = (a, b) => {
  const ax = a % C.grid, ay = (a / C.grid) | 0, bx = b % C.grid, by = (b / C.grid) | 0;
  return Math.max(Math.abs(ax - bx), Math.abs(ay - by));
};

// ── simulation ───────────────────────────────────────────────
function tick(dt) {
  if (S.over) return;

  if (S.lit) {
    S.wood -= C.upkeepWood * dt;
    S.heat -= S.heat * C.decay * dt;
    if (S.wood <= 0) { S.wood = 0; S.lit = false; S.heat = 0; }
    if (S.heat < 0.5) { S.heat = 0; S.lit = false; }
  } else {
    S.heat = 0;
  }

  // heat reaching the vessel: scaled by distance, and smoothed by it too
  if (S.cuc >= 0 && S.pit >= 0) {
    const d = Math.min(dist(S.cuc, S.pit), C.falloff.length - 1);
    const target = S.heat * C.falloff[d];
    const lag = C.lag[d];
    S.local = lag <= 0 ? target : S.local + (target - S.local) * (1 - Math.exp(-dt / lag));
  } else {
    S.local = 0;
  }

  // refining: throughput rises with heat, purity falls past the limit
  if (S.cuc >= 0 && S.materia > 0 && S.local > 1) {
    const consumed = Math.min(S.materia, C.refine * S.local * dt);
    const over = Math.max(0, S.local - C.pureLimit) / C.vaporWidth;
    const vaporFrac = Math.min(1, over * over);
    S.materia -= consumed;
    S.distillate += consumed * (1 - vaporFrac);
    S.vapor += consumed * vaporFrac;
  }

  // strain
  if (S.local > C.strainAt) S.strain += (S.local - C.strainAt) * C.strainRate * dt * 100;
  else S.strain = Math.max(0, S.strain - C.strainRelief * dt * 100);

  if (S.strain >= 100) finish('The cucurbit cracked. Everything left in it is lost.');
  else if (S.materia <= 0.001) finish('All the materia is spent.');
  else if (!S.lit && S.wood <= 0) finish('The wood is gone and the fire is out.');
}

function finish(why) {
  S.over = why;
  S.lit = false;
}

// ── view ─────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const gridEl = $('grid');

for (let i = 0; i < C.grid * C.grid; i++) {
  const c = document.createElement('div');
  c.className = 'cell'; c.dataset.i = i;
  c.addEventListener('click', () => onCell(i));
  gridEl.appendChild(c);
}

function onCell(i) {
  if (S.over) return;
  // once lit, clicking the pit stokes it
  if (S.lit && i === S.pit) { stoke(); return; }
  if (S.lit) return;                       // no rearranging mid-burn

  if (S.tool === 'clr') {
    if (i === S.pit) S.pit = -1;
    if (i === S.cuc) S.cuc = -1;
  } else if (S.tool === 'pit') {
    if (i === S.cuc) S.cuc = -1;
    S.pit = i;
  } else {
    if (i === S.pit) S.pit = -1;
    S.cuc = i;
  }
  render();
}

function stoke() {
  if (!S.lit || S.over || S.wood < C.stokeWood) return;
  S.wood -= C.stokeWood;
  S.heat = Math.min(C.maxHeat, S.heat + C.stokeHeat);
}

$('t-pit').onclick = () => { S.tool = 'pit'; render(); };
$('t-cuc').onclick = () => { S.tool = 'cuc'; render(); };
$('t-clr').onclick = () => { S.tool = 'clr'; render(); };
$('b-stoke').onclick = stoke;
$('b-reset').onclick = reset;
$('b-light').onclick = () => {
  if (S.pit < 0 || S.cuc < 0 || S.lit || S.over || S.wood < 2) return;
  S.lit = true; S.heat = 20; S.wood -= 2;
  render();
};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); stoke(); }
});

const n = (x, d = 0) => x.toFixed(d);

function render() {
  gridEl.childNodes.forEach((c, i) => {
    const isPit = i === S.pit, isCuc = i === S.cuc;
    c.textContent = isPit ? '🔥' : isCuc ? '⚗️' : '';
    c.className = 'cell' + (isPit ? ' pit' : '') + (isPit && S.lit ? ' lit' : '');
    if (S.pit >= 0 && S.lit) {
      const d = dist(i, S.pit);
      if (d <= 2) c.classList.add('glow');
    }
    if (isPit || isCuc) {
      const t = document.createElement('div');
      t.className = 'tag'; t.textContent = isPit ? 'pit' : 'vessel';
      c.appendChild(t);
    }
  });

  $('t-pit').className = S.tool === 'pit' ? 'sel' : '';
  $('t-cuc').className = S.tool === 'cuc' ? 'sel' : '';
  $('t-clr').className = S.tool === 'clr' ? 'sel' : '';

  $('g-heat').style.width = (S.heat / C.maxHeat * 100) + '%';
  $('l-heat').textContent = 'flame ' + n(S.heat);
  $('g-local').style.width = (S.local / C.maxHeat * 100) + '%';
  $('l-local').textContent = 'vessel ' + n(S.local);
  $('m-safe').style.left = (C.pureLimit / C.maxHeat * 100) + '%';
  $('m-danger').style.left = (C.strainAt / C.maxHeat * 100) + '%';
  $('g-strain').style.width = Math.min(100, S.strain) + '%';

  $('v-wood').textContent = n(S.wood, 1);
  $('v-mat').textContent = n(S.materia, 1);
  $('v-dist').textContent = n(S.distillate, 1);
  $('v-vap').textContent = n(S.vapor, 1);

  $('b-light').disabled = S.lit || S.over || S.pit < 0 || S.cuc < 0;
  $('b-stoke').disabled = !S.lit || S.over || S.wood < C.stokeWood;

  let h;
  if (S.over) {
    h = `<span class="over">${S.over}</span><br>Distillate: <b>${n(S.distillate, 1)}</b>` +
        ` &nbsp;·&nbsp; vapour lost: ${n(S.vapor, 1)}`;
  } else if (S.pit < 0 || S.cuc < 0) {
    h = 'Place a fire pit and a cucurbit. Sitting the vessel <em>on</em> the pit tracks the flame ' +
        'instantly — hot, fast, and it strains. Set it a cell away and the heat arrives slow and ' +
        'smoothed, which is gentler but caps lower.';
  } else if (!S.lit) {
    const d = Math.min(dist(S.cuc, S.pit), C.falloff.length - 1);
    h = `Distance ${d}: the vessel sees ${(C.falloff[d] * 100) | 0}% of the flame, ` +
        `smoothed over ${C.lag[d]}s. Light it when you're ready.`;
  } else {
    h = 'Click the fire (or press space) to stoke. Past the gold line the materia turns to ' +
        'vapour and escapes — but throughput keeps climbing, so the best yield sits just over it.';
  }
  $('hint').innerHTML = h;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  tick(dt);
  render();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
